spring.application.name=projeto-matex

# Banco de dados (PostgreSQL local)
# Credenciais vêm de variáveis de ambiente: nunca versionar senha
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/matex}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Tabelas criadas manualmente: o Hibernate apenas valida o mapeamento
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
